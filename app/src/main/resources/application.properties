# GearRent Capstone Application Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.application.name=gearrent
quarkus.application.version=1.0.0-SNAPSHOT

# SmallRye Health endpoints (/q/health, /q/health/live, /q/health/ready)
quarkus.smallrye-health.root-path=/q/health

# Micrometer Prometheus Metrics (/q/metrics)
quarkus.micrometer.export.prometheus.path=/q/metrics

# OpenAPI & Swagger UI (/q/swagger-ui & /q/openapi)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
mp.openapi.extensions.smallrye.info.title=GearRent API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Cloud-Native Multimedia Equipment Rental & Maintenance System

# Database & Hibernate ORM Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/capstone}
quarkus.datasource.username=${DB_USER:capstone}
quarkus.datasource.password=${DB_PASSWORD:capstone}

# Schema Generation & Initial Seed Data
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=false

# Test Profile (in-memory H2 for clean CI tests)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
