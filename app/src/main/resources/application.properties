# GearRent Capstone Application Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.application.name=gearrent
quarkus.application.version=1.0.0-SNAPSHOT

# SmallRye Health endpoints (/q/health, /q/health/live, /q/health/ready)
quarkus.smallrye-health.root-path=/q/health

# Micrometer Prometheus Metrics (/q/metrics) & Datasource Pool Metrics (M5)
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.datasource.metrics.enabled=true

# OpenAPI & Swagger UI (/q/swagger-ui & /q/openapi)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
mp.openapi.extensions.smallrye.info.title=GearRent API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Cloud-Native Multimedia Equipment Rental & Maintenance System
mp.openapi.filter=id.ac.upnvj.gearrent.security.OpenApiHeaderFilter

# Database & Hibernate ORM Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/capstone}
quarkus.datasource.username=${DB_USER:capstone}
quarkus.datasource.password=${DB_PASSWORD:capstone}

# Auth Context (M2 uses trusted headers for local/test validation; M6 switches to false + Keycloak OIDC)
gearrent.auth.trust-headers=true

# Object Storage Defaults (MinIO-ready metadata; local temp storage for M2 until MinIO is wired)
gearrent.storage.bucket=gearrent-inspections
gearrent.storage.local-dir=${java.io.tmpdir}/gearrent-photos

# Schema Generation & Idempotent Seed (preserve data across pod restarts)
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

# Test Profile (in-memory H2 + random port so Keycloak on 8081 never collides)
%test.quarkus.http.test-port=0
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=no-file
