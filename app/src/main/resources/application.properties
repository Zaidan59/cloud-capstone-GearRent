# GearRent Capstone Application Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.application.name=gearrent
quarkus.application.version=1.0.0-SNAPSHOT

# SmallRye Health endpoints (/q/health, /q/health/live, /q/health/ready)
quarkus.smallrye-health.root-path=/q/health

# Micrometer Prometheus Metrics (/q/metrics)
quarkus.micrometer.export.prometheus.path=/q/metrics

# OpenAPI & Swagger UI (/q/swagger-ui & /q/openapi)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
mp.openapi.extensions.smallrye.info.title=GearRent API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Cloud-Native Multimedia Equipment Rental & Maintenance System
