global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: capstone-app
    metrics_path: /q/metrics
    static_configs:
      - targets:
          - host.docker.internal:8088
        labels:
          environment: local-capstone

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
