apiVersion: v1
kind: Namespace
metadata:
  name: capstone-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-smoke
  namespace: capstone-smoke
spec:
  replicas: 1
  selector:
    matchLabels: {app: capstone-smoke}
  template:
    metadata:
      labels: {app: capstone-smoke}
    spec:
      containers:
        - name: smoke
          image: __SMOKE_IMAGE__
          imagePullPolicy: Always
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-smoke
  namespace: capstone-smoke
spec:
  selector: {app: capstone-smoke}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone-smoke
  namespace: capstone-smoke
spec:
  rules:
    - host: smoke.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capstone-smoke
                port: {number: 80}
